name: mern-tasks

services:
  mongo:
    image: mongo:8
    container_name: mern-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: dev
    container_name: mern-server
    init: true                      # Forwards signals so graceful shutdown works
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/mern_tasks   # "mongo" is the service name on the Docker network
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./server/src:/app/server/src   # Hot reload: edits on the host reach the container
    depends_on:
      - mongo

  client:
    build:
      context: .                    # project root, so workspaces are visible
      dockerfile: client/Dockerfile
      target: dev
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: mern-client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo-data: